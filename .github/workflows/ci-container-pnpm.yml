name: container 模式 pnpm

on:
  push:
    branches:
      - master

jobs:
  pnpm:
    runs-on: ubuntu-latest
    container:
      image: node:22

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 通过 corepack 启用 pnpm
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate

      - name: 配置 pnpm 缓存
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/../.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: 安装依赖并执行测试
        run: |
          pnpm i
          node pnpm.js

      - name: 分析运行环境
        run: |
          echo ""
          echo "===== 1. /proc/mounts 中查找 GitHub workspace 相关挂载 ====="
          grep "$GITHUB_WORKSPACE" /proc/mounts || echo "(无 workspace 相关条目)"

          echo ""
          echo "===== 2. 所有挂载点 (mount) ====="
          cat /proc/mounts

          echo ""
          echo "===== 3. df -h 查看各挂载点设备和文件系统 ====="
          df -h
