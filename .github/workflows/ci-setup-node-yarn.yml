name: CI setup-node yarn

on:
  push:
    branches:
      - master

jobs:
  yarn:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'

      - run: |
          yarn
          node yarn.js
