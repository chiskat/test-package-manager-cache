name: CI container yarn

on:
  push:
    branches:
      - master

jobs:
  yarn:
    runs-on: ubuntu-latest
    container:
      image: node:22

    steps:
      - uses: actions/checkout@v4

      - run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate

      - uses: actions/cache@v4
        with:
          path: /usr/local/share/.cache/yarn
          key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - run: |
          yarn
          node yarn.js
