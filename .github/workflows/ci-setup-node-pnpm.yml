name: CI setup-node pnpm

on:
  push:
    branches:
      - master

jobs:
  pnpm:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - run: |
          corepack enable
          corepack prepare pnpm@latest --activate

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - run: |
          pnpm i
          node pnpm.js

      - run: |
          echo ""
          echo "===== 1. /proc/mounts 中查找 GitHub workspace 相关挂载 ====="
          grep "$GITHUB_WORKSPACE" /proc/mounts || echo "(无 workspace 相关条目)"

          echo ""
          echo "===== 2. 所有挂载点 (mount) ====="
          cat /proc/mounts

          echo ""
          echo "===== 3. df -h 查看各挂载点设备和文件系统 ====="
          df -h

          echo ""
          echo "===== 4. workspace 和 pnpm 默认 store 的设备号对比 ====="
          PNPM_STORE_PATH="$(pnpm store path)"
          mkdir -p "$PNPM_STORE_PATH"
          stat -c "%n  dev=%d  ino=%i  type=%F" "$GITHUB_WORKSPACE"
          stat -c "%n  dev=%d  ino=%i  type=%F" "$HOME/.local/share"
          stat -c "%n  dev=%d  ino=%i  type=%F" "$HOME/.local/share/pnpm"
          stat -c "%n  dev=%d  ino=%i  type=%F" "$PNPM_STORE_PATH"
          echo "pnpm store path: $PNPM_STORE_PATH"

          echo ""
          echo "===== 5. 实际尝试向 pnpm 默认 store 创建硬链接 ====="
          echo "hello" > "$GITHUB_WORKSPACE/testfile.txt"
          ln "$GITHUB_WORKSPACE/testfile.txt" "$PNPM_STORE_PATH/testfile_hardlink.txt" \
            && echo "pnpm 默认 store 硬链接创建成功" \
            || echo "硬链接创建失败"

          echo ""
          echo "===== 6. 对比：在 workspace 内部创建硬链接 ====="
          ln "$GITHUB_WORKSPACE/testfile.txt" "$GITHUB_WORKSPACE/testfile_hardlink.txt" \
            && echo "workspace 内部硬链接成功" \
            || echo "workspace 内部硬链接失败"

          echo ""
          echo "===== 7. 对比：创建软链接跨挂载点 ====="
          ln -s "$GITHUB_WORKSPACE/testfile.txt" "$PNPM_STORE_PATH/testfile_symlink.txt" \
            && echo "软链接创建成功" \
            || echo "软链接创建失败"

          echo ""
          echo "===== 8. findmnt 显示挂载树 ====="
          findmnt --output TARGET,SOURCE,FSTYPE,OPTIONS || echo "findmnt 不可用"
