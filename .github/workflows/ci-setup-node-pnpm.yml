name: setup-node 模式 pnpm

on:
  push:
    branches:
      - master

jobs:
  pnpm:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: 安装 node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: 安装依赖并执行测试
        run: |
          pnpm i
          node pnpm.js

      - name: 分析运行环境
        run: |
          echo ""
          echo "===== 1. /proc/mounts 中查找 GitHub workspace 相关挂载 ====="
          grep "$GITHUB_WORKSPACE" /proc/mounts || echo "(无 workspace 相关条目)"

          echo ""
          echo "===== 2. 所有挂载点 (mount) ====="
          cat /proc/mounts

          echo ""
          echo "===== 3. df -h 查看各挂载点设备和文件系统 ====="
          df -h
