kind: pipeline
name: default

workspace:
  path: /test-package-manager-cache

trigger:
  branch:
    - master

steps:
  - name: echo-npm
    image: node:20.13.0
    commands:
      - npm i
      - node npm.js

  - name: echo-yarn
    image: node:20.13.0
    commands:
      - yarn
      - node yarn.js

  - name: echo-pnpm
    image: node:20.13.0
    commands:
      - npm i -g pnpm
      - pnpm i
      - node pnpm.js
