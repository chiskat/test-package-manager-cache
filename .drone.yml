kind: pipeline
name: default

trigger:
  branch:
    - master

steps:
  - name: echo-npm
    image: chiskat/baseline-node20:2026.4.26
    commands:
      - npm i
      - node npm.js
      - rm -rf package-lock.json node_modules

  - name: echo-yarn
    image: chiskat/baseline-node20:2026.4.26
    commands:
      - yarn
      - node yarn.js
      - rm -rf yarn.lock node_modules

  - name: echo-pnpm
    image: chiskat/baseline-node20:2026.4.26
    commands:
      - pnpm i
      - node pnpm.js
      - rm -rf pnpm-lock.yaml node_modules

  - name: check-volume
    image: chiskat/baseline-node20:2026.4.26
    commands:
      - |
        echo ""
        echo "===== 1. /proc/mounts 中查找 /drone 相关挂载 ====="
        grep drone /proc/mounts || echo "(无 drone 相关条目)"

        echo ""
        echo "===== 2. 所有挂载点 (mount) ====="
        cat /proc/mounts

        echo ""
        echo "===== 3. df -h 查看各挂载点设备和文件系统 ====="
        df -h
